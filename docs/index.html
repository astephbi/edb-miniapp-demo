ietes:[`BICICI`,`ONATEL BF`],coach:`Coach EDB`,date:`2026-10-18`,duree:`1 h 35`,transcript:Lo(`deux valeurs bancaire et télécom`)},{id:`c3`,type:`etude`,titre:`Analyse technique — 4 valeurs du week-end`,societes:[`NSIA BANQUE`,`NESTLE CI`,`BICICI`,`ONATEL BF`],coach:`Coach EDB`,date:`2026-10-27`,duree:`58 min`,transcript:Lo(`quatre valeurs sous l'angle technique`)},{id:`c4`,type:`etude`,titre:`Analyse fondamentale — Total CI, Total SN & SMB`,societes:[`TOTAL CI`,`TOTAL SN`,`SMB`],coach:`Coach EDB`,date:`2026-11-01`,duree:`1 h 50`,transcript:Lo(`trois valeurs du secteur énergie et mines`),nouveau:!0},{id:`c5`,type:`audio`,titre:`Comprendre le CMP sans se tromper`,societes:[],coach:`Brice (voix de démo)`,date:`2026-09-14`,duree:`6 min`,transcript:[{t:0,txt:`Aujourd'hui, une question qui revient tout le temps : le CMP, le coût moyen pondéré.`},{t:35,txt:`Imaginez que vous achetez des sacs de riz à des prix différents. Votre prix moyen, c'est tout ce que vous avez payé divisé par le nombre de sacs.`},{t:95,txt:`En bourse, c'est pareil : on additionne le coût de tous vos achats d'une action, frais compris, et on divise par le nombre d'actions détenues.`},{t:160,txt:`Quand vous renforcez à un prix plus bas, votre CMP baisse. Quand vous renforcez plus haut, il monte. C'est normal.`},{t:230,txt:`Plus-value latente : le gain sur le papier, tant que vous n'avez pas vendu. Plus-value réalisée : le gain encaissé après la vente.`},{t:300,txt:`Utilisez le calculateur de l'application plutôt que de refaire le calcul à la main.`}],tags:[`cmp`,`plus-value`]},{id:`c6`,type:`audio`,titre:`Pourquoi mon ordre n'est pas passé ?`,societes:[],coach:`Brice (voix de démo)`,date:`2026-08-30`,duree:`5 min`,transcript:[{t:0,txt:`Parlons des ordres, parce que beaucoup d'entre vous me disent : mon ordre n'est pas passé.`},{t:40,txt:`Un ordre à cours limité, c'est comme dire au vendeur : je ne paie pas plus que tel prix. S'il n'y a personne à ce prix, rien ne se passe.`},{t:110,txt:`Un ordre au marché s'exécute au prix disponible. Il est rapide, mais vous ne maîtrisez pas le prix.`},{t:175,txt:`Vérifiez toujours la durée de validité de votre ordre auprès de votre SGI : un jour, une semaine, ou jusqu'à annulation.`},{t:240,txt:`Et regardez le carnet d'ordres avant d'acheter une valeur peu échangée.`}],tags:[`ordre`,`carnet`]},{id:`c7`,type:`audio`,titre:`Spécial diaspora : alimenter son compte`,societes:[],coach:`Brice (voix de démo)`,date:`2026-07-12`,duree:`4 min`,transcript:[{t:0,txt:`Cette séance est pour nos membres de la diaspora.`},{t:30,txt:`Pour alimenter votre compte depuis l'étranger, demandez à votre SGI la liste exacte des moyens acceptés : virement bancaire, transfert d'argent ou mobile money.`},{t:100,txt:`Gardez toujours la preuve de votre virement et envoyez-la à votre SGI par écrit. C'est elle qui débloque les situations.`},{t:160,txt:`Pour la fiscalité dans votre pays de résidence, rapprochez-vous d'un professionnel local : les règles changent d'un pays à l'autre.`}],tags:[`diaspora`,`virement`]},{id:`c8`,type:`partenaire`,titre:`Note de recherche partenaire — banques UEMOA`,societes:[`SGBCI`,`BOA CI`,`NSIA BANQUE`],coach:`SGI partenaire`,date:`2026-09-14`,duree:`PDF · 12 pages`,transcript:[{t:0,txt:`Document partenaire. L'EDB ne partage pas nécessairement ses conclusions.`}]},{id:`c9`,type:`reco`,titre:`Avis EDB daté — valeurs de rente (archive)`,societes:[`SONATEL`,`ORANGE CI`,`SGBCI`],coach:`EDB Assistance`,date:`2026-02-18`,duree:`Fiche`,transcript:[{t:0,txt:`Fiche d'archive : l'avis est daté et peut ne plus être d'actualité. Ce n'est pas un conseil personnalisé.`}]}],zo={etude:{nom:`Études EDB`,icone:`🎥`},audio:{nom:`Audios coach`,icone:`🎧`},partenaire:{nom:`Partenaires`,icone:`📄`},reco:{nom:`Avis datés`,icone:`📌`}},Bo=[{id:`a1`,jour:`Dim. 8 nov.`,heure:`17h00`,titre:`Étude en direct — 2 valeurs de la cote`,lieu:`Cour familiale`,type:`etude`},{id:`a2`,jour:`Dim. 8 nov.`,heure:`18h00`,titre:`Analyse technique du week-end`,lieu:`Cour fam
